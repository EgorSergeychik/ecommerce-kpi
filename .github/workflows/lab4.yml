name: Lab 4 Quality Gate

on:
  push:
    branches: [ "main", "master", "feat/lab4" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  helm-grading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.0

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: lab4-cluster

      - name: Run Master Validation Script
        run: |
          chmod +x ./tests/lab4_test.sh
          ./tests/lab4_test.sh
