services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "8080:8000"
    environment:
      APP_ENV: local
      APP_KEY: base64:81bZ5NUZlHfA+lgmFcqcW7Ajw1tLmCV5J2wXyarv6d8=
      LOG_CHANNEL: stderr

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: example_app
      DB_USER: laravel_user
      DB_PASSWORD: laravel_password
      DB_USERNAME: ${DB_USER:-laravel_user}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: db
    environment:
      MYSQL_DATABASE: example_app
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: laravel_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plaravel_password"]
      interval: 5s
      timeout: 5s
      retries: 5
